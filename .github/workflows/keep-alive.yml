name: Render Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes so neither Render Free Tier service hits the 15-minute idle timeout
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Urnisa Main Backend (/health)
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 --retry 2 --retry-delay 5 "https://urnisa-backend-3b3m.onrender.com/health" || echo "000")
          echo "urnisa-backend /health -> HTTP $STATUS"

      - name: Ping Urnisa DBot Service (/health)
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 --retry 2 --retry-delay 5 "https://urnisa-dbot.onrender.com/health" || echo "000")
          echo "urnisa-dbot /health -> HTTP $STATUS"
